config:
  target: "https://jsonplaceholder.typicode.com"
  phases:
    - duration: 3
      arrivalRate: 2
      name: "Goit Performance Test"
  payload:
    - path: "Homework.csv"
      fields:
        - "keyword1"
        - "keyword2"
      order: "sequence"

  plugins:
    ensure: {}

  ensure:
    thresholds:
      - http.response_time.max: 1600
      - http.response_time.p99: 1000

  conditions:
    - expression: http.responses == 4
    - expression: vusers.failed == 0
    - expression: http.response_time.max <1000 and http.response_time.p95 <500

scenarios:
  - name: Create Account
    flow:
      - get:
          url: "/posts"

      - post:
          url: "/posts"
          json:
            username: "{{ keyword1 }}"
            password: "{{ keyword2 }}"
          headers:
            Content-Type: "application/json"

      - log: "İlk değer: {{ keyword1 }}"
      - log: "İkinci değer: {{ keyword2 }}"